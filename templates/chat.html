<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Medical Assistant</title>

<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="app-container">

<!-- =====================================================
SIDEBAR
===================================================== -->

<div class="sidebar" id="sidebar">

<div class="sidebar-header">

<h3>Medical Assistant</h3>

<button id="newChatButton" class="new-chat-btn">
+ New Chat
</button>

</div>


<div class="conversation-title">
Conversations
</div>


<div id="conversationList" class="conversation-list">

{% for conversation in conversations %}

<div class="conversation-item"
     data-id="{{ conversation.id }}">

<div class="conversation-info">

<span class="conversation-name">
{{ conversation.title }}
</span>

</div>

<button
class="delete-btn"
data-id="{{ conversation.id }}"
title="Delete conversation">

×
</button>

</div>

{% endfor %}

</div>

</div>


<!-- =====================================================
MAIN CHAT
===================================================== -->

<div class="chat-wrapper">

<!-- HEADER -->

<div class="chat-header">

<div class="header-content">

<button
id="mobileMenuButton"
class="mobile-menu-btn">

☰

</button>

<img
src="https://cdn-icons-png.flaticon.com/512/387/387569.png"
class="chat-avatar"
alt="Medical Assistant"
>

<div>

<h4>Medical Assistant</h4>

<p>AI Health Companion</p>

</div>

</div>

</div>


<!-- CHAT BODY -->

<div id="chatBox" class="chat-body">

<div class="chat-message bot">

<img
src="https://cdn-icons-png.flaticon.com/512/387/387569.png"
class="bot-icon"
alt="Bot"
>

<div class="bubble">

Hello! Ask me a medical question.

</div>

</div>

</div>


<!-- INPUT -->

<form
id="messageForm"
class="chat-input-area">

<input
type="text"
id="userInput"
class="chat-input"
placeholder="Ask medical question..."
autocomplete="off"
required
>

<button
type="submit"
id="sendButton"
class="send-btn">

➤

</button>

</form>

</div>

</div>


<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
